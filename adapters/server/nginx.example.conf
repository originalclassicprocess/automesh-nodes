# Include in nginx's http context. Replace example host and certificate paths.
map $http_upgrade $automesh_connection {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=automesh_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=automesh_connections:10m;
server {
    listen 443 ssl;
    server_name node.example.com;
    ssl_certificate /etc/automesh-node/tls-cert.pem;
    ssl_certificate_key /etc/automesh-node/private/tls-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 192k;
    client_body_timeout 10s;
    limit_conn automesh_connections 16;
    # Do not log pairing bodies, signatures, tokens or QR URLs.
    access_log off;
    location ~ ^/(node/(info|challenge|pair|join)|mailbox/(put|list|receipts|ack|grant|revoke|status)|outbox/(put|status|receipts|file/(start|part|cancel))|inbox/(list|ack|file/parts)|admin/(connect/(start|poll|cancel|approve)|status|logout|invite|members/remove))$ {
        limit_req zone=automesh_api burst=60 nodelay;
        proxy_pass https://127.0.0.1:3003;
        proxy_set_header Host node.example.com;
        proxy_ssl_server_name on;
        proxy_ssl_name node.example.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 15s;
        proxy_request_buffering on;
    }
    # Public panel assets only; never forward arbitrary application paths.
    location ~ ^/(panel\.(mjs|css))?$ {
        limit_req zone=automesh_api burst=10 nodelay;
        proxy_pass https://127.0.0.1:3003;
        proxy_set_header Host node.example.com;
        proxy_ssl_server_name on;
        proxy_ssl_name node.example.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 15s;
    }
    location = /signal {
        limit_req zone=automesh_api burst=10 nodelay;
        proxy_pass https://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host node.example.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $automesh_connection;
        proxy_ssl_server_name on;
        proxy_ssl_name node.example.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
    # Never proxy /status, /pair-code, /members/remove or any control listener.
    location / { return 404; }
}
